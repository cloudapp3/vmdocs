name: Deploy vmlg docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "sites/vmlg/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-vmlg-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-vmlg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vmlg docs site
        run: pnpm docs:build:vmlg

      - name: Add custom domain
        run: echo "vmlg.bestcheapvps.org" > sites/vmlg/docs/.vitepress/dist/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/vmlg/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
